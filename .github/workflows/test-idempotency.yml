name: Test #1 - Transaction & Recovery Idempotency

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  idempotency:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 35

      - name: Run duplicate transaction and recovery test
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
          TEST_ID: TXN-E2E-IDEMPOTENCY-${{ github.run_id }}
        run: |
          set -euo pipefail

          function make_request() {
            local step_name="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"

            echo "------------------------------------------------------------" >&2
            echo "[TEST #1] STEP: $step_name" >&2
            echo "[TEST #1] ENDPOINT: $method $url" >&2

            local response_file
            response_file=$(mktemp)
            local status_code

            if [ -n "$body" ]; then
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                --data "$body")
            else
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Accept: application/json')
            fi

            local response_body
            response_body=$(cat "$response_file")
            rm -f "$response_file"

            echo "[TEST #1] HTTP STATUS: $status_code" >&2
            echo "[TEST #1] RESPONSE: $response_body" >&2

            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              echo "❌ FAILED: $step_name returned HTTP $status_code" >&2
              return 1
            fi

            printf '%s' "$response_body"
          }

          payload=$(cat <<JSON
          {
            "transaction_id":"${TEST_ID}",
            "merchant_id":"mer_chronova_watches",
            "order_id":"order_${TEST_ID}",
            "payment_id":"pay_${TEST_ID}",
            "amount_minor":371300,
            "currency":"INR",
            "source":"live",
            "status":"failed",
            "provider":"razorpay",
            "failure_code":"GATEWAY_ERROR_3DS_TIMEOUT",
            "metadata":{"scenario_id":"3ds_timeout","test":"idempotency"}
          }
          JSON
          )

          echo "=== 1. First transaction ingestion ==="
          first=$(make_request "1. First transaction ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$payload")
          echo "$first" | jq -e '.success == true and .duplicate == false and .transaction_id == env.TEST_ID' >/dev/null

          echo "=== 2. Duplicate transaction ingestion ==="
          second=$(make_request "2. Duplicate transaction ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$payload")
          echo "$second" | jq -e '.success == true and .duplicate == true and .transaction_id == env.TEST_ID' >/dev/null

          echo "=== 3. First recovery execution ==="
          recovery_payload=$(jq -n --arg id "$TEST_ID" '{transaction_id:$id, action_type:"Send payment link"}')
          recovery_first=$(make_request "3. First recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$recovery_payload")
          echo "$recovery_first" | jq -e '.success == true and .duplicate == false and (.recovery_operation_id | length > 0)' >/dev/null

          RECOVERY_ID=$(echo "$recovery_first" | jq -r '.recovery_operation_id')
          export RECOVERY_ID

          echo "=== 4. Duplicate recovery execution ==="
          recovery_second=$(make_request "4. Duplicate recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$recovery_payload")
          echo "$recovery_second" | jq -e --arg rec_id "$RECOVERY_ID" '.success == true and .duplicate == true and .recovery_operation_id == $rec_id' >/dev/null

          second_recovery_id=$(echo "$recovery_second" | jq -r '.recovery_operation_id')
          test "$RECOVERY_ID" = "$second_recovery_id"

          echo "=== 5. Verify transaction detail ==="
          detail=$(make_request "5. Verify transaction detail" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
          echo "$detail" | jq -e '.transaction.id == env.TEST_ID and .transaction.status == "IN_PROGRESS"' >/dev/null

          echo "------------------------------------------------------------"
          echo "🎉 PASS: Transaction ingestion is idempotent and recovery execution is idempotent."
