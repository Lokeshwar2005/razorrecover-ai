name: Test Suite - E2E Verification

on:
  workflow_dispatch:

concurrency:
  group: e2e-test-suite
  cancel-in-progress: false

jobs:
  test_suite:
    runs-on: ubuntu-latest
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Vercel production deployment
        run: sleep 50

      - name: 1. Run Test #1 — Transaction & Recovery Idempotency
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
          TEST_ID: TXN-E2E-IDEMPOTENCY-${{ github.run_id }}
        run: |
          set -euo pipefail

          function make_request() {
            local step_name="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"

            echo "------------------------------------------------------------" >&2
            echo "[TEST #1] STEP: $step_name" >&2
            echo "[TEST #1] ENDPOINT: $method $url" >&2

            local response_file
            response_file=$(mktemp)
            local status_code

            if [ -n "$body" ]; then
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                -H "x-github-token: $GIST_TOKEN" \
                --data "$body")
            else
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Accept: application/json' \
                -H "x-github-token: $GIST_TOKEN")
            fi

            local response_body
            response_body=$(cat "$response_file")
            rm -f "$response_file"

            echo "[TEST #1] HTTP STATUS: $status_code" >&2
            echo "[TEST #1] RESPONSE: $response_body" >&2

            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              echo "❌ FAILED: $step_name returned HTTP $status_code" >&2
              return 1
            fi

            printf '%s' "$response_body"
          }

          payload=$(cat <<JSON
          {
            "transaction_id":"${TEST_ID}",
            "merchant_id":"mer_chronova_watches",
            "order_id":"order_${TEST_ID}",
            "payment_id":"pay_${TEST_ID}",
            "amount_minor":371300,
            "currency":"INR",
            "source":"live",
            "status":"failed",
            "provider":"razorpay",
            "failure_code":"GATEWAY_ERROR_3DS_TIMEOUT",
            "metadata":{"scenario_id":"3ds_timeout","test":"idempotency"}
          }
          JSON
          )

          echo "=== 1. First transaction ingestion ==="
          res1=$(make_request "1. First transaction ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$payload")
          echo "$res1" | jq -e '.success == true and .duplicate == false and .status == "STOPPED" and .transaction_id == env.TEST_ID' >/dev/null

          sleep 1

          echo "=== 2. Duplicate transaction ingestion ==="
          res2=$(make_request "2. Duplicate transaction ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$payload")
          echo "$res2" | jq -e '.success == true and .duplicate == true and .status == "STOPPED" and .transaction_id == env.TEST_ID' >/dev/null

          sleep 1

          echo "=== 3. First recovery execution ==="
          recovery_payload=$(jq -n --arg id "$TEST_ID" '{transaction_id:$id, action_type:"Send payment link"}')
          res3=$(make_request "3. First recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$recovery_payload")
          op_id1=$(echo "$res3" | jq -r '.recovery_operation_id')
          echo "$res3" | jq -e '.success == true and .duplicate == false and .workflow_status == "COMPLETE" and (.recovery_operation_id | length > 0)' >/dev/null

          sleep 1

          echo "=== 4. Duplicate recovery execution ==="
          res4=$(make_request "4. Duplicate recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$recovery_payload")
          op_id2=$(echo "$res4" | jq -r '.recovery_operation_id')
          echo "$res4" | jq -e '.success == true and .duplicate == true and .workflow_status == "COMPLETE"' >/dev/null

          if [ "$op_id1" != "$op_id2" ]; then
            echo "❌ FAILED: Duplicate recovery produced a different operation ID" >&2
            exit 1
          fi

          sleep 1

          echo "=== 5. Verify transaction detail ==="
          detail=$(make_request "5. Verify transaction detail" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
          echo "$detail" | jq -e '.transaction.id == env.TEST_ID and .transaction.status == "IN_PROGRESS"' >/dev/null

          echo "🎉 PASS: Test #1 — Transaction & Recovery Idempotency"

      - name: 2. Run Test #2 — End-to-End Recovery & Verification Lifecycle
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
          TEST_ID: TXN-E2E-TEST2-RECOVERY-${{ github.run_id }}
          PAYMENT_ID: pay_test_capture_${{ github.run_id }}
          ORDER_ID: order_test_${{ github.run_id }}
          AMOUNT_MINOR: 899500
        run: |
          set -euo pipefail

          function make_request() {
            local step_name="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"

            echo "------------------------------------------------------------" >&2
            echo "[TEST #2] STEP: $step_name" >&2
            echo "[TEST #2] ENDPOINT: $method $url" >&2

            local response_file
            response_file=$(mktemp)
            local status_code

            if [ -n "$body" ]; then
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                -H "x-github-token: $GIST_TOKEN" \
                --data "$body")
            else
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Accept: application/json' \
                -H "x-github-token: $GIST_TOKEN")
            fi

            local response_body
            response_body=$(cat "$response_file")
            rm -f "$response_file"

            echo "[TEST #2] HTTP STATUS: $status_code" >&2
            echo "[TEST #2] RESPONSE: $response_body" >&2

            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              echo "❌ FAILED: $step_name returned HTTP $status_code" >&2
              return 1
            fi

            printf '%s' "$response_body"
          }

          echo "=== 1. Storefront payment failure ingestion ==="
          step1_payload=$(cat <<JSON
          {
            "transaction_id":"${TEST_ID}",
            "merchant_id":"mer_chronova_watches",
            "order_id":"${ORDER_ID}",
            "amount_minor":${AMOUNT_MINOR},
            "currency":"INR",
            "source":"live",
            "status":"failed",
            "provider":"razorpay",
            "failure_code":"GATEWAY_ERROR_3DS_TIMEOUT",
            "metadata":{"scenario_id":"3ds_timeout","test":"test_2_recovery_flow"}
          }
          JSON
          )
          step1_res=$(make_request "1. Storefront failure ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$step1_payload")
          echo "$step1_res" | jq -e '.success == true and .duplicate == false and .status == "STOPPED" and .transaction_id == env.TEST_ID' >/dev/null

          sleep 1

          echo "=== 2. Autonomous recovery execution ==="
          step2_payload=$(jq -n --arg id "$TEST_ID" --argjson amt "$AMOUNT_MINOR" '{transaction_id:$id, action_type:"Send payment link", amount_minor:$amt, currency:"INR"}')
          step2_res=$(make_request "2. Autonomous recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$step2_payload")
          echo "$step2_res" | jq -e '.success == true and .workflow_status == "COMPLETE" and (.recovery_operation_id | length > 0)' >/dev/null

          sleep 1

          echo "=== 3. Verify invariant: Unrecovered before payment settlement ==="
          step3_res=$(make_request "3. Verify invariant before settlement" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
          echo "$step3_res" | jq -e '.transaction.id == env.TEST_ID and .transaction.status == "IN_PROGRESS" and .transaction.verified_amount_minor == 0' >/dev/null

          sleep 1

          echo "=== 4. Settle payment & verify capture ==="
          step4_payload=$(jq -n --arg id "$TEST_ID" --arg pay_id "$PAYMENT_ID" --arg ord_id "$ORDER_ID" --argjson amt "$AMOUNT_MINOR" '{transaction_id:$id, payment_id:$pay_id, order_id:$ord_id, amount_minor:$amt, currency:"INR"}')
          step4_res=$(make_request "4. Settle payment & verify capture" "POST" "$API_BASE/api/v1/recovery/verify" "$step4_payload")
          echo "$step4_res" | jq -e '.verified == true and .status == "captured" and .payment_id == env.PAYMENT_ID' >/dev/null

          sleep 1

          echo "=== 5. Verify final ledger state ==="
          step5_res=""
          for i in {1..5}; do
            step5_res=$(make_request "5. Verify final ledger state (attempt $i)" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
            if echo "$step5_res" | jq -e '.transaction.status == "RECOVERED"' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "$step5_res" | jq -e --arg pay_id "$PAYMENT_ID" --argjson amt "$AMOUNT_MINOR" '.transaction.id == env.TEST_ID and .transaction.status == "RECOVERED" and .transaction.verified_amount_minor == $amt and .transaction.provider_payment_id == $pay_id' >/dev/null

          echo "🎉 PASS: Test #2 — End-to-End Recovery & Verification Lifecycle"

      - name: 3. Run Test #3 — All 8 Payment Failure Scenarios & AI Recovery
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
        run: npx tsx scripts/test-all-scenarios-e2e.ts

      - name: 4. Run Test #5 — Full E2E Customer Storefront to Recovery Lifecycle
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
        run: npx tsx scripts/test-e2e-customer-to-recovery.ts

      - name: 5. Run Test #6 — Security & Production Integrity Audit Suite
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
        run: npx tsx scripts/test-security-integrity.ts
