name: Test #2 - End-to-End Recovery & Verification Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery_lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 35

      - name: Run end-to-end recovery and verification lifecycle test
        env:
          API_BASE: ${{ vars.API_BASE || 'https://razorrecover-ai-teal.vercel.app' }}
          TEST_ID: TXN-E2E-TEST2-RECOVERY-${{ github.run_id }}
          PAYMENT_ID: pay_test_capture_${{ github.run_id }}
          ORDER_ID: order_test_${{ github.run_id }}
          AMOUNT_MINOR: 899500
        run: |
          set -euo pipefail

          function make_request() {
            local step_name="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"

            echo "------------------------------------------------------------" >&2
            echo "[TEST #2] STEP: $step_name" >&2
            echo "[TEST #2] ENDPOINT: $method $url" >&2

            local response_file
            response_file=$(mktemp)
            local status_code

            if [ -n "$body" ]; then
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                --data "$body")
            else
              status_code=$(curl -s -o "$response_file" -w "%{http_code}" -X "$method" "$url" \
                -H 'Accept: application/json')
            fi

            local response_body
            response_body=$(cat "$response_file")
            rm -f "$response_file"

            echo "[TEST #2] HTTP STATUS: $status_code" >&2
            echo "[TEST #2] RESPONSE: $response_body" >&2

            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              echo "❌ FAILED: $step_name returned HTTP $status_code" >&2
              return 1
            fi

            printf '%s' "$response_body"
          }

          echo "============================================================"
          echo "🧪 RUNNING TEST #2: END-TO-END RECOVERY & VERIFICATION FLOW"
          echo "   TEST_ID: $TEST_ID"
          echo "   PAYMENT_ID: $PAYMENT_ID"
          echo "   API_BASE: $API_BASE"
          echo "============================================================"

          echo "=== 1. Storefront payment failure ingestion ==="
          step1_payload=$(cat <<JSON
          {
            "transaction_id":"${TEST_ID}",
            "merchant_id":"mer_chronova_watches",
            "order_id":"${ORDER_ID}",
            "amount_minor":${AMOUNT_MINOR},
            "currency":"INR",
            "source":"live",
            "status":"failed",
            "provider":"razorpay",
            "failure_code":"GATEWAY_ERROR_3DS_TIMEOUT",
            "metadata":{"scenario_id":"3ds_timeout","test":"test_2_recovery_flow"}
          }
          JSON
          )
          step1_res=$(make_request "1. Storefront failure ingestion" "POST" "$API_BASE/api/v1/transactions/events" "$step1_payload")
          echo "$step1_res" | jq -e '.success == true and .duplicate == false and .status == "STOPPED" and .transaction_id == env.TEST_ID' >/dev/null

          sleep 1

          echo "=== 2. Autonomous recovery execution ==="
          step2_payload=$(jq -n --arg id "$TEST_ID" --argjson amt "$AMOUNT_MINOR" '{transaction_id:$id, action_type:"Send payment link", amount_minor:$amt, currency:"INR"}')
          step2_res=$(make_request "2. Autonomous recovery execution" "POST" "$API_BASE/api/v1/recovery/execute" "$step2_payload")
          echo "$step2_res" | jq -e '.success == true and .workflow_status == "COMPLETE" and (.recovery_operation_id | length > 0)' >/dev/null

          sleep 1

          echo "=== 3. Verify invariant: Unrecovered before payment settlement ==="
          step3_res=$(make_request "3. Verify invariant before settlement" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
          echo "$step3_res" | jq -e '.transaction.id == env.TEST_ID and .transaction.status == "IN_PROGRESS" and .transaction.verified_amount_minor == 0' >/dev/null

          sleep 1

          echo "=== 4. Settle payment & verify capture ==="
          step4_payload=$(jq -n --arg id "$TEST_ID" --arg pay_id "$PAYMENT_ID" --arg ord_id "$ORDER_ID" --argjson amt "$AMOUNT_MINOR" '{transaction_id:$id, payment_id:$pay_id, order_id:$ord_id, amount_minor:$amt, currency:"INR"}')
          step4_res=$(make_request "4. Settle payment & verify capture" "POST" "$API_BASE/api/v1/recovery/verify" "$step4_payload")
          echo "$step4_res" | jq -e '.verified == true and .status == "captured" and .payment_id == env.PAYMENT_ID' >/dev/null

          sleep 1

          echo "=== 5. Verify final ledger state ==="
          step5_res=$(make_request "5. Verify final ledger state" "GET" "$API_BASE/api/v1/transactions/$TEST_ID")
          echo "$step5_res" | jq -e --arg pay_id "$PAYMENT_ID" --argjson amt "$AMOUNT_MINOR" '.transaction.id == env.TEST_ID and .transaction.status == "RECOVERED" and .transaction.verified_amount_minor == $amt and .transaction.provider_payment_id == $pay_id' >/dev/null

          echo "------------------------------------------------------------"
          echo "🎉 PASS: End-to-end recovery and capture verification lifecycle completed successfully."
